server {
    port = 8948
    port = ${?PROXY_PORT}
}

upstream {
    baseUrl = "https://litellm.labs.jb.gg"
    baseUrl = ${?UPSTREAM_BASE_URL}

    apiKey = ""
    apiKey = ${?UPSTREAM_API_KEY}

    defaultModel = "hetzner/zai-org/GLM-5.2-FP8"
    defaultModel = ${?UPSTREAM_DEFAULT_MODEL}

    timeoutSeconds = 300
    timeoutSeconds = ${?UPSTREAM_TIMEOUT_SECONDS}

    # Sampling temperature applied when the incoming request does not carry one
    # (Claude Code never sends temperature).
    temperature = 1.0
    temperature = ${?UPSTREAM_TEMPERATURE}

    # top_p applied when the incoming request does not carry one.
    topP = 0.95
    topP = ${?UPSTREAM_TOP_P}

    # Forward the client's output_config.effort (e.g. "high") to the upstream as
    # reasoning_effort.
    forwardEffort = true
    forwardEffort = ${?UPSTREAM_FORWARD_EFFORT}

insecureSkipTlsVerify = true
}

thinking {
    # Directory where completed thinking blocks are saved as JSON lines, one file
    # per request (thinking-<timestamp>-<short-id>.jsonl). Empty = disabled.
    saveDirectory = "build/thinking"
    saveDirectory = ${?THINKING_SAVE_DIRECTORY}
}

debug {
    # Log every incoming HTTP request after it completes as "METHOD path -> status"
    # (including 404s for unknown endpoints). On by default.
    logRequests = true
    logRequests = ${?PROXY_DEBUG_LOG_REQUESTS}

    # Log the raw JSON bodies being proxied: ">>> upstream <json>" (sent to upstream)
    # and "<<< downstream <json>" (received from upstream). Off by default.
    logBodies = false
    logBodies = ${?PROXY_DEBUG_LOG_BODIES}
}

